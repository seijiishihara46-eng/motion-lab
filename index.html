<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyrko</title>
  <link rel="stylesheet" href="styles/field.css">
</head>
<body class="field field--pre-meaning">

  <nav class="field-nav" aria-label="field zones">
    <button class="zone zone--pre-meaning" data-zone="pre-meaning" aria-label="pre-meaning zone">
      <span class="zone-sigil">◁</span>
      <span class="zone-label">pre-meaning</span>
    </button>
    <button class="zone zone--convergence" data-zone="convergence" aria-label="convergence zone">
      <span class="zone-sigil">◈</span>
      <span class="zone-label">convergence</span>
    </button>
    <button class="zone zone--manifestation" data-zone="manifestation" aria-label="manifestation zone">
      <span class="zone-sigil">▷</span>
      <span class="zone-label">manifestation</span>
    </button>
  </nav>

  <main class="field-body">
    <canvas id="field-canvas" aria-hidden="true"></canvas>
    <div class="glyph-layer" id="glyph-layer" aria-hidden="true"></div>
    <div class="orbit-layer" id="orbit-layer" aria-hidden="true"></div>
    <div class="manifestation-layer" id="manifestation-layer">
      <p class="convergence-status" id="convergence-status" aria-live="polite"></p>
    </div>
  </main>

  <footer class="field-margin">
    <span class="field-label">observation field</span>
    <span class="coherence-readout" id="coherence-readout" aria-hidden="true"></span>
  </footer>

  <script type="module" src="src/field.js"></script>
</body>
</html>
