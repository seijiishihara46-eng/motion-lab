<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Lab — 舞台演出3Dビジュアライザ</title>
  <link rel="stylesheet" href="styles/stage.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="app">

  <header id="toolbar">
    <span class="app-title">STAGE LAB</span>
    <div class="toolbar-sep"></div>
    <button class="tool-btn" id="add-person">👤 人物</button>
    <button class="tool-btn" id="add-light">💡 照明</button>
    <button class="tool-btn" id="add-screen">📺 スクリーン</button>
    <button class="tool-btn" id="add-laser">⚡ レーザー</button>
    <button class="tool-btn" id="add-sfx">✨ 特効</button>
    <div class="toolbar-sep"></div>
    <button class="tool-btn danger" id="delete-selected">🗑 削除</button>
    <div class="toolbar-sep"></div>
    <span class="toolbar-label">ビュー:</span>
    <button class="view-btn active" data-view="perspective">3D</button>
    <button class="view-btn" data-view="top">上面</button>
    <button class="view-btn" data-view="front">正面</button>
    <div class="toolbar-sep"></div>
    <span id="hover-info" class="toolbar-label"></span>
    <button class="tool-btn" id="pipeline-btn" style="margin-left:auto;color:var(--accent);border-color:var(--accent)">🎬 ワークフロー</button>
  </header>

  <div id="workspace">

    <aside id="element-list-panel">
      <div class="panel-header">エレメント</div>
      <div id="element-list"></div>
    </aside>

    <div id="viewport">
      <canvas id="stage-canvas"></canvas>
      <div id="viewport-overlay">
        <span id="mode-indicator">SELECT MODE — クリックで選択</span>
      </div>
    </div>

    <aside id="inspector">
      <div class="panel-header">プロパティ</div>
      <div id="inspector-content">
        <p class="inspector-hint">エレメントを選択してください</p>
      </div>
    </aside>

  </div>

  <div id="cue-panel">

    <div id="cue-controls">
      <div class="panel-header">トランスポート</div>
      <div id="cue-transport">
        <button id="btn-go" class="go-btn">GO</button>
        <button id="btn-stop" class="stop-btn">■ STOP</button>
        <button id="btn-reset" class="icon-btn">⏮ RESET</button>
        <button id="btn-add-cue" class="icon-btn accent">＋ CUE</button>
        <div id="cue-status">Ready</div>
        <div id="next-cue-label"></div>
      </div>
    </div>

    <div id="cue-list-wrap">
      <div class="panel-header">キューリスト</div>
      <div id="cue-list"></div>
    </div>

    <div id="cue-editor">
      <div class="panel-header" id="cue-editor-header">CUEアクション</div>
      <div id="cue-meta"></div>
      <div id="cue-action-list"></div>
      <button id="btn-add-action" class="icon-btn" style="margin:4px 0">＋ アクション追加</button>
    </div>

  </div>

</div>

<!-- Pipeline Modal -->
<div id="pipeline-modal"></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
